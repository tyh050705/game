                    ph += "<button onclick='selectFromArmyPick(" + ai2.id + ")'>" + icon + " 军团#" + ai2.id + " " + ai2.hp + "HP/" + ai2.atk + "攻" + info + "</button>";
                }
                ph += "</div>";
                acts.innerHTML = ph; return;
            }

            /* 技术封锁选择 */
            if (techblockSelecting) { renderTechBlockMenu(); return; }

            if (pick) {
                var hint = "请点击地图";
                if (pick.mode === "buildCity") hint = "选建工程城市";
                if (pick.mode === "armyCity") hint = "选建军城市";
                if (pick.mode === "deathstarCity") hint = "选死星建造城市";
                if (pick.mode === "deathstarTarget") hint = "点击敌方城市作为死星目标";
                if (pick.mode === "interceptCity") hint = "选拦截弹目标己方城市";
                if (pick.mode === "reviveArmy") hint = "选目标军队";
                if (pick.mode === "pursuitArmy") hint = "选目标军队";
                if (pick.mode === "doomchargeArmy") hint = "选目标军队（决死冲锋）";
                if (pick.mode === "giantfortCity") hint = "选巨型堡垒化城市";
                acts.innerHTML = "<div class='pickbox'><b>选择中</b>：" + hint + "<br><button onclick='cancelPick()'>取消（不扣 AE）</button></div>";
                return;
            }
            if (engCtx) { renderEngMenu(); return; }
            if (fortCtx) { renderFortMenu(); return; }
            if (buildCtx) { renderBuildMenu(); return; }
            if (techMenu) { renderTechMenu(); return; }

            if (fortMode) {
                acts.innerHTML = "<div class='pickbox'><b>工事模式</b><br><span class='dim'>剩余预算 " + fortBudgetRemaining(active) + "/" + fortBudgetMax(active) + "</span><br><button onclick='endFort()' style='border-color:#f59e0b;font-weight:bold'>结束工事</button></div>";
                return;
            }

            var p2 = players[active];
            var btn = "";
            var canEng = p2.ae >= 1 && hasCityForEng(active);
            var canArmy = p2.ae >= 1 && myArmies(active).length < armyCap(active) && hasCityForArmy(active);
            var canFort = p2.ae >= 1 && coresOf(active) > 0;
            var canTech = p2.ae >= 1;
            var canDS = p2.ae >= 1 && canBuildDeathStar(active);

            btn += "<button onclick='actBuild()'" + (canEng ? "" : " disabled") + ">建工程</button>";
            btn += "<button onclick='actArmy()'" + (canArmy ? "" : " disabled") + ">建军</button>";
            btn += "<button onclick='actFort()'" + (canFort ? "" : " disabled") + ">建工事</button>";
            btn += "<button onclick='actTech()'" + (canTech ? "" : " disabled") + ">科技</button>";
            btn += "<button onclick='startDeathStarAction()'" + (canDS ? "" : " disabled") + " style='border-color:#a855f7'>☄ 建死星</button>";

            if (moveMode) {
                btn += "<button onclick='useSpeed()' " + (p2.techs.speed && !p2.speedUsed ? "" : " disabled") + ">速行(40铁)</button>";
                btn += "<button onclick='endMove()' style='border-color:#f59e0b;font-weight:bold'>结束移动</button>";
            } else {
                btn += "<button onclick='actMove()'" + (p2.ae < 1 ? " disabled" : "") + ">移动</button>";
                btn += "<button onclick='actSkip()'" + (p2.ae < 1 ? " disabled" : "") + ">跳过</button>";
            }

            /* 死星开火按钮 */
            if (selected !== null) {
                var a3 = findArmy(selected);
                if (a3 && a3.isDeathStar && a3.owner === active && a3.charge >= 2 && players[active].uranium >= 20) {
                    btn += "<button onclick='startDeathStarFire()' style='border-color:#a855f7;font-weight:bold'>☄ 发射死星（20铀）</button>";
                }
            }

            if (p2.techs.uraniumplant && !p2.blocked.uraniumplant && p2.uraniumTrades < 3)
                btn += "<button onclick='doUraniumTrade()'>铀浓缩兑换(" + p2.uraniumTrades + "/3)</button>";

            var warns = [];
            if (p2.ae >= 1 && !hasCityForEng(active)) warns.push("工程槽全满");
            if (p2.ae >= 1 && myArmies(active).length >= armyCap(active)) warns.push("军队达上限" + armyCap(active));
            else if (p2.ae >= 1 && !hasCityForArmy(active)) warns.push("驻军全满");
            if (warns.length) btn += "<div class='warn'>⚠ " + warns.join("；") + "</div>";
            acts.innerHTML = btn;
        }

        function renderDetail() {
            var el = document.getElementById("detail");
            if (!viewCell) { el.innerHTML = "<div class='box'><span class='dim'>点击格子查看详情</span></div>"; return; }
            var c = cellAt(viewCell.x, viewCell.y), base = baseStats(c);
            var html = "<div class='box'><div><b>(" + c.x + "," + c.y + ")</b> " + cityTypeName(c) + " · " + ownerName(c.owner) + "</div>";
            html += "<div>当前：<b>" + c.hp + "HP</b>/<b>" + c.atk + "攻</b></div>";
            html += "<div class='dim'>基础：" + base.hp + "HP/" + base.atk + "攻</div>";
            var flags = [];
            if (c.flags.fortified) flags.push("堡垒化");
            if (c.flags.empShield) flags.push("拦截弹");
            html += "<div>增益：<span style='color:#22c55e'>" + sgn(c.gainHp) + "HP/" + sgn(c.gainAtk) + "攻</span>";
            if (flags.length) html += " <span class='dim'>[" + flags.join("、") + "]</span>";
            html += "</div>";
            html += "<div>工程槽：" + c.eng.length + "/" + ENG_LIMIT_PER_CITY + "</div>";
            for (var j = 0; j < c.eng.length; j++) { var ed = engDef(c.eng[j].id); if (ed) html += "<div style='font-size:11px'>· " + ed.name + "：" + engEffectText(ed) + "</div>"; }
            html += "<div style='margin-top:4px'>工事：" + c.forts.length + "座</div>";
            for (var fj = 0; fj < c.forts.length; fj++) { var fd = fortDef(c.forts[fj].id); if (fd) html += "<div style='font-size:11px'>· " + fd.name + "：" + fortEffectText(fd) + "</div>"; }
            var list = armiesAt(c.x, c.y);
            html += "<div style='margin-top:4px'>驻军" + list.length + "/2</div>";
            for (var k = 0; k < list.length; k++) {
                var a = list[k];
                var line = "· ";
                if (a.isDeathStar) {
                    line += "☄死星#" + a.id + "(" + ownerName(a.owner) + ") " + a.hp + "HP/" + a.atk + "攻 ⚡" + Math.max(0, a.charge) + "/2";
                } else {
                    line += "军团#" + a.id + "(" + ownerName(a.owner) + ") " + a.hp + "HP/" + a.atk + "攻 军功" + a.merit + "/3" + (a.doomTimer > 0 ? " <span style='color:#ef4444'>决死" + a.doomTimer + "</span>" : "");
                }
                html += "<div style='font-size:11px'>" + line + "</div>";
            }
            html += "</div>"; el.innerHTML = html;
        }

        function cellClass(c) { if (c.owner === 0) return "own0"; if (c.owner === 1) return "own1"; if (c.type === CITY_NEUTRAL) return "neu"; return "empty"; }
        function cellText(c) { if (c.type === CITY_NONE && c.owner === -1) return "空地"; return c.hp + "HP/" + c.atk + "攻"; }

        function renderMap() {
            var html = "";
            for (var y = 0; y < N; y++) {
                html += "<tr>";
                for (var x = 0; x < N; x++) {
                    var c = cellAt(x, y), cls = cellClass(c);
                    if (pick && c.owner === active && c.hp > 0) {
                        if (pick.mode === "buildCity" && c.eng.length >= ENG_LIMIT_PER_CITY) cls += " full";
                        else if (pick.mode === "armyCity" && armiesAt(x, y).length >= 2) cls += " full";
                        else if (pick.mode === "deathstarCity" && armiesAt(x, y).length >= 2) cls += " full";
                        else if (pick.mode === "deathstarTarget") cls += " full";
                        else cls += " pick";
                    }
                    if (fortMode && c.owner === active && c.hp > 0) cls += " pick";
                    if (pick && pick.mode === "deathstarTarget" && c.owner >= 0 && c.owner !== active && c.hp > 0) cls += " full";
                    for (var i = 0; i < armies.length; i++) if (armies[i].id === selected && armies[i].x === x && armies[i].y === y) cls += " sel";
                    if (viewCell && viewCell.x === x && viewCell.y === y) cls += " view";
                    var hasDS = false;
                    var list = armiesAt(x, y);
                    for (var di = 0; di < list.length; di++) if (list[di].isDeathStar) hasDS = true;
                    if (hasDS) cls += " ds";
                    html += "<td class='" + cls + "' onclick='clickCell(" + x + "," + y + ")'>";
                    html += "<div style='font-size:10px;color:#7b8fa3'>" + x + "," + y + (c.eng.length ? " ⚙" + c.eng.length : "") + (c.forts.length ? " 🛡" + c.forts.length : "") + "</div>";
                    html += "<div style='font-size:12px'>" + cellText(c) + "</div>";
                    for (var j = 0; j < list.length; j++) {
                        var a = list[j];
                        var col = a.owner === 0 ? "#93c5fd" : "#fca5a5";
                        var icon = a.isDeathStar ? "☄" : "★";
                        var charge = a.isDeathStar ? " ⚡" + Math.max(0, a.charge) : "";
                        var doom = a.doomTimer > 0 ? " ☠" + a.doomTimer : "";
                        var si = moveMode && a.id === selected ? " (" + ((a.hasSpeed ? 5 : 2) - a.steps) + "步)" : "";
                        html += "<div style='font-size:11px;color:" + col + "'>" + icon + a.hp + "/" + a.atk + charge + doom + si + "</div>";
                    }
                    html += "</td>";
                }
                html += "</tr>";
            }
            document.getElementById("map").innerHTML = html;
        }

        function renderLog() {
            var html = "";
            for (var i = logs.length - 1; i >= 0; i--) html += "<div>" + logs[i] + "</div>";
            document.getElementById("log").innerHTML = html;
        }

        function render() { renderHud(); renderSide(); renderMap(); renderLog(); renderDetail(); }

        newGame();
        render();

    </script>
</body>
</html>
